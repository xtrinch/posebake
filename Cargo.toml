[package]
name = "posebake"
version = "0.1.0"
edition = "2024"
description = "Pose skinned glTF models and bake them into static OBJ meshes with colours sampled from their textures"
readme = "README.md"
keywords = ["gltf", "obj", "skinning", "mesh", "vertex-color"]
categories = ["graphics", "game-development", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
glam = "0.34.2"
gltf = "1.4.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[dev-dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.154"
